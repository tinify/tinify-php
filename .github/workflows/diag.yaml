---
name: DIAG win54 TLS

on: [pull_request]

permissions: {}

jobs:
  # Byte-for-byte the failing job, matrix trimmed to the one cell.
  exact:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: ["5.4"]
        os: [windows-latest]
    name: exact-replica
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: ${{ startsWith(matrix.php-version, '5.') && 'composer:2.2' || 'composer:v2' }}
      - uses: actions/checkout@v3
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress
      - name: Run test suite
        run: vendor/bin/phpunit

  # Same, minus the validate step.
  no_validate:
    runs-on: windows-latest
    timeout-minutes: 30
    name: no-validate-step
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: "5.4"
          tools: composer:2.2
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress
      - name: Run test suite
        run: vendor/bin/phpunit
