---
name: DIAG win54 TLS

on: [pull_request]

permissions: {}

jobs:
  Unit_tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: [
          "5.4",
          "5.6",
          "7.4",
          "8.0",
          "8.5",
        ]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: ${{ matrix.php-version }}
          # composer 2.3 raised its floor to PHP 7.2.5, so the 5.x jobs need
          # the 2.2 LTS line. composer:v2 resolves to the newest 2.x.
          tools: ${{ startsWith(matrix.php-version, '5.') && 'composer:2.2' || 'composer:v2' }}
      - uses: actions/checkout@v3
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress
      - name: Run test suite
        run: vendor/bin/phpunit
