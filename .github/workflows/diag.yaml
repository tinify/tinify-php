---
name: DIAG win54 TLS

on: [pull_request]

permissions: {}

jobs:
  composer_version:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        composer: ["2.2.9", "2.2.21", "2.2.31"]
    name: composer-${{ matrix.composer }}
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: "5.4"
          tools: composer:${{ matrix.composer }}
      - uses: actions/checkout@v3
      - name: Report composer version
        shell: bash
        run: composer --version
      - name: composer install
        continue-on-error: true
        run: composer install --no-ansi --no-interaction --no-progress
      - name: Did vendor get created?
        shell: bash
        run: |
          if [ -d vendor ]; then echo "RESULT: vendor present - INSTALL OK"; else echo "RESULT: no vendor - INSTALL FAILED"; fi
