---
name: DIAG win54 TLS

on: [pull_request]

permissions: {}

jobs:
  memory:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "A-production-ini-default-memory"
            ini: ""
          - label: "B-unlimited-memory"
            ini: "memory_limit=-1"
          - label: "C-512M"
            ini: "memory_limit=512M"
    name: ${{ matrix.label }}
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: "5.4"
          tools: composer:2.2
          ini-values: ${{ matrix.ini }}
      - uses: actions/checkout@v3
      - name: Report effective memory_limit
        shell: bash
        run: php -r 'echo "memory_limit=", ini_get("memory_limit"), PHP_EOL;'
      - name: composer install, capture exit code
        shell: bash
        run: |
          set +e
          composer install --no-ansi --no-interaction --no-progress > out.txt 2> err.txt
          echo "COMPOSER EXIT=$?"
          echo "--- stdout ---"; tail -8 out.txt
          echo "--- stderr ---"; tail -8 err.txt
