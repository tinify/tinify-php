---
name: DIAG win54 TLS

on: [pull_request]

permissions: {}

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ["5.4", "5.6"]
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.2
          ini-values: display_errors=On, error_reporting=-1, memory_limit=-1

      - name: Runtime shape
        shell: bash
        run: |
          php -r 'echo "PHP_INT_SIZE=", PHP_INT_SIZE, " (4=32bit, 8=64bit)", PHP_EOL;'
          php -r 'echo "memory_limit=", ini_get("memory_limit"), PHP_EOL;'
          php -r 'echo "php.ini=", php_ini_loaded_file(), PHP_EOL;'

      - name: Fetch packages.json with curl and parse it
        shell: bash
        run: |
          cat > f.php <<'PHP'
          <?php
          $ch = curl_init("https://repo.packagist.org/packages.json");
          curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
          curl_setopt($ch, CURLOPT_ENCODING, "");
          $body = curl_exec($ch);
          if ($body === false) {
              echo "CURL FAILED: ", curl_error($ch), PHP_EOL; exit(1);
          }
          echo "downloaded bytes=", strlen($body), PHP_EOL;
          echo "mem after download=", memory_get_usage(true), PHP_EOL;
          $d = json_decode($body, true);
          echo "json_decode=", ($d === null ? "NULL err=" . json_last_error() : "OK keys=" . count($d)), PHP_EOL;
          echo "mem after decode=", memory_get_usage(true), PHP_EOL;
          PHP
          set +e
          php f.php
          echo "   exit=$?"

      - name: composer install with stderr merged, full output
        shell: bash
        run: |
          set +e
          composer install --no-ansi --no-interaction --no-progress -vvv > out.txt 2> err.txt
          echo "   composer exit=$?"
          echo "----- stdout tail -----"; tail -20 out.txt
          echo "----- stderr tail -----"; tail -40 err.txt
