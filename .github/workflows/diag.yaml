---
name: DIAG win54 TLS

on: [pull_request]

permissions: {}

jobs:
  shell_test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ["5.4", "5.6"]
    name: shell-${{ matrix.php-version }}
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:2.2
      - uses: actions/checkout@v3

      - name: A. composer install under DEFAULT shell (pwsh on Windows)
        continue-on-error: true
        run: composer install --no-ansi --no-interaction --no-progress

      - name: Clean between attempts
        shell: bash
        run: rm -rf vendor composer.lock

      - name: B. composer install under bash
        continue-on-error: true
        shell: bash
        run: composer install --no-ansi --no-interaction --no-progress

      - name: C. does composer write to stderr on this PHP?
        shell: bash
        run: |
          rm -rf vendor composer.lock
          set +e
          composer install --no-ansi --no-interaction --no-progress 2> stderr_only.txt 1> stdout_only.txt
          echo "exit=$?"
          echo "--- stderr bytes: $(wc -c < stderr_only.txt) ---"
          cat stderr_only.txt | head -10
