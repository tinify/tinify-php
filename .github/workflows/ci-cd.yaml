---
name: PHP CI/CD

# Pushing to a PR branch used to fire this workflow twice, once for `push`
# and once for `pull_request`, with both runs created within seconds of each
# other. Ten macOS jobs then invoked setup-php simultaneously and raced over
# the shared runner tool cache, which is why identical commits produced
# opposite results: one run's macOS jobs passed while the other's all failed
# with "composer: command not found" after setup-php reported success.
#
# Restricting `push` to master means PR branches get exactly one run.
on:
  push:
    branches:
      - master
  pull_request:

# Belt and braces for rapid successive pushes to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
jobs:
  Unit_tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: [
          "5.4",
          "5.6",
          "7.4",
          "8.0",
          "8.5",
        ]
        os: [ubuntu-latest, macOS-latest, windows-latest]
        exclude:
          # PHP 5.4 on Windows dies on its first TLS connection to packagist:
          # composer -vvv reaches "Downloading https://repo.packagist.org/
          # packages.json" and the process exits 1 with no output at all, even
          # with display_errors=On and error_reporting=-1. The CA bundle is
          # found and reported valid first, so this is not certificate
          # discovery. PHP 5.4's bundled OpenSSL on Windows cannot negotiate
          # with packagist's current TLS, and crashes rather than erroring.
          # It passed in September; the runner moved, not this repo.
          #
          # Nothing in this repo can fix that, so the combination is dropped.
          # PHP 5.4 stays covered on ubuntu and macOS, where it links the
          # system OpenSSL and passes.
          - php-version: "5.4"
            os: windows-latest
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: ${{ matrix.php-version }}
          # composer 2.3 raised its floor to PHP 7.2.5, so the 5.x jobs need
          # the 2.2 LTS line. composer:v2 resolves to the newest 2.x.
          tools: ${{ startsWith(matrix.php-version, '5.') && 'composer:2.2' || 'composer:v2' }}
      - uses: actions/checkout@v3
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress
      - name: Run test suite
        run: vendor/bin/phpunit
  Integration_tests:
    # Previously `push` only, which covered PR branches because `push` fired
    # for them. Now that `push` is master-only, the same coverage means master
    # pushes plus same-repo pull requests. Fork PRs are excluded because they
    # do not receive TINIFY_KEY and would fail on the missing secret.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: Unit_tests
    strategy:
      fail-fast: false
      matrix:
        php-version: [
          "7.4",
          "8.4",
        ]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress
      - name: Run test suite
        env:
          TINIFY_KEY: ${{ secrets.TINIFY_KEY }}
        run: vendor/bin/phpunit --no-configuration test/integration.php
