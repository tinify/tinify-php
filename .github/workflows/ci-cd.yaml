---
name: PHP CI/CD

# Pushing to a PR branch used to fire this workflow twice, once for `push`
# and once for `pull_request`, with both runs created within seconds of each
# other. Ten macOS jobs then invoked setup-php simultaneously and raced over
# the shared runner tool cache, which is why identical commits produced
# opposite results: one run's macOS jobs passed while the other's all failed
# with "composer: command not found" after setup-php reported success.
#
# Restricting `push` to master means PR branches get exactly one run.
on:
  push:
    branches:
      - master
  pull_request:

# Belt and braces for rapid successive pushes to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
jobs:
  Unit_tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: [
          "5.4",
          "5.6",
          "7.4",
          "8.0",
          "8.5",
        ]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          # composer 2.3 raised its floor to PHP 7.2.5, so the 5.x jobs need the
          # 2.2 LTS line, and `composer:2.2` resolves to its newest release.
          # That is 2.2.31, released 2026-10-29, which breaks `composer install`
          # on PHP 5.4 under Windows: it exits 1 having printed nothing and
          # without creating vendor/. Bisected across the whole range -- 2.2.22
          # through 2.2.30 all work and only 2.2.31 fails -- so pin 2.2.30, the
          # highest good release. Every composer security advisory in this line
          # is fixed at 2.2.24 or earlier, so nothing is given up by pinning
          # here. Revisit when a 2.2.32 ships.
          tools: ${{ startsWith(matrix.php-version, '5.') && 'composer:2.2.30' || 'composer:v2' }}
      - uses: actions/checkout@v3
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress
      - name: Fail if dependencies did not actually install
        shell: bash
        run: test -d vendor || { echo "composer install produced no vendor/"; exit 1; }
      - name: Run test suite
        run: vendor/bin/phpunit
  Integration_tests:
    # Previously `push` only, which covered PR branches because `push` fired
    # for them. Now that `push` is master-only, the same coverage means master
    # pushes plus same-repo pull requests. Fork PRs are excluded because they
    # do not receive TINIFY_KEY and would fail on the missing secret.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: Unit_tests
    strategy:
      fail-fast: false
      matrix:
        php-version: [
          "7.4",
          "8.4",
        ]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress
      - name: Run test suite
        env:
          TINIFY_KEY: ${{ secrets.TINIFY_KEY }}
        run: vendor/bin/phpunit --no-configuration test/integration.php
