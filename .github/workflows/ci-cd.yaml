---
name: PHP CI/CD

# Pushing to a PR branch used to fire this workflow twice, once for `push`
# and once for `pull_request`, with both runs created within seconds of each
# other. Ten macOS jobs then invoked setup-php simultaneously and raced over
# the shared runner tool cache, which is why identical commits produced
# opposite results: one run's macOS jobs passed while the other's all failed
# with "composer: command not found" after setup-php reported success.
#
# Restricting `push` to master means PR branches get exactly one run.
on:
  push:
    branches:
      - master
  pull_request:

# Belt and braces for rapid successive pushes to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}
jobs:
  Unit_tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: [
          "5.4",
          "5.6",
          "7.4",
          "8.0",
          "8.5",
        ]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    env:
      # PHP 5.4 on Windows cannot complete a TLS handshake with packagist and
      # crashes rather than erroring, so composer cannot fetch anything there.
      # For that one cell, dependencies are resolved and downloaded under a
      # modern PHP -- with composer told to solve for 5.4 via config.platform
      # -- and only the test run happens under 5.4 itself.
      CROSS_RESOLVE: ${{ matrix.php-version == '5.4' && matrix.os == 'windows-latest' }}
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: ${{ (matrix.php-version == '5.4' && matrix.os == 'windows-latest') && '8.3' || matrix.php-version }}
          # composer 2.3 raised its floor to PHP 7.2.5, so the 5.x jobs need
          # the 2.2 LTS line. composer:v2 resolves to the newest 2.x.
          tools: ${{ startsWith(matrix.php-version, '5.') && 'composer:2.2' || 'composer:v2' }}
      - uses: actions/checkout@v3
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Target PHP 5.4 when resolving under a newer runtime
        if: env.CROSS_RESOLVE == 'true'
        run: composer config platform.php 5.4.45
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress
      - name: Switch to the PHP under test
        if: env.CROSS_RESOLVE == 'true'
        uses: shivammathur/setup-php@2.32.0
        with:
          php-version: ${{ matrix.php-version }}
      - name: Confirm the runtime is the one under test
        run: php -r 'echo PHP_VERSION, PHP_EOL;'
      - name: Run test suite
        run: vendor/bin/phpunit
  Integration_tests:
    # Previously `push` only, which covered PR branches because `push` fired
    # for them. Now that `push` is master-only, the same coverage means master
    # pushes plus same-repo pull requests. Fork PRs are excluded because they
    # do not receive TINIFY_KEY and would fail on the missing secret.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: Unit_tests
    strategy:
      fail-fast: false
      matrix:
        php-version: [
          "7.4",
          "8.4",
        ]
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: shivammathur/setup-php@2.32.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-progress
      - name: Run test suite
        env:
          TINIFY_KEY: ${{ secrets.TINIFY_KEY }}
        run: vendor/bin/phpunit --no-configuration test/integration.php
